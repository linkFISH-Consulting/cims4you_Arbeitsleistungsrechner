name: CI

# Runs lint + unit tests on every pull request.
# Note: this cannot exercise the script against the real cims4you.com site
# (requires authenticated login and live server state), so checks are limited
# to static analysis and unit tests of the pure logic (e.g. parseDate).
on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run verify-version
